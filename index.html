<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中控后台</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!-- 侧边栏 -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">
    <span class="brand-icon">⚙️</span>
    <span class="brand-text">中控后台</span>
  </div>
  <nav class="sidebar-nav" id="sidebarNav">
    <a class="nav-item active" data-page="dashboard">
      <span class="nav-icon">📊</span>
      <span class="nav-label">仪表盘</span>
    </a>
    <a class="nav-item" data-page="api-config">
      <span class="nav-icon">🔑</span>
      <span class="nav-label">API 配置</span>
    </a>
    <a class="nav-item" data-page="data-query">
      <span class="nav-icon">🔍</span>
      <span class="nav-label">数据查询</span>
    </a>
    <a class="nav-item" data-page="table-reader">
      <span class="nav-icon">📋</span>
      <span class="nav-label">表格读取</span>
    </a>
    <a class="nav-item" data-page="pipeline">
      <span class="nav-icon">📤</span>
      <span class="nav-label">一键推送</span>
    </a>
    <a class="nav-item" data-page="settings">
      <span class="nav-icon">⚡</span>
      <span class="nav-label">系统设置</span>
    </a>
  </nav>
  <div class="sidebar-footer">
    <span class="version">v0.2.0</span>
  </div>
</aside>

<!-- 主区域 -->
<div class="main-wrapper">
  <!-- 顶栏 -->
  <header class="topbar">
    <button class="menu-toggle" id="menuToggle" title="展开/收起侧边栏">☰</button>
    <h1 class="page-title" id="pageTitle">仪表盘</h1>
    <div class="topbar-actions">
      <span class="topbar-status" id="serverStatus">⏳ 检测中...</span>
    </div>
  </header>

  <!-- 内容区 -->
  <main class="content" id="contentArea">
    <!-- 页面内容由 JS 动态渲染 -->
  </main>
</div>

<script src="js/app.js"></script>
</body>
</html>
